<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0f0c0a">
  <title>DOKO Cocina</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="../assets/img/logo-128.png">
  <link rel="apple-touch-icon" href="../assets/img/logo-192.png">
  <link rel="stylesheet" href="cocina.css">
</head>
<body data-vista="nuevo">
  <!-- Pantallas de acceso (clave y nombre) -->
  <div class="gate" data-gate hidden>
    <form class="gate__card" data-gate-form>
      <img src="../assets/img/logo-192.png" alt="" width="72" height="72">
      <h1 data-gate-title>DOKO Cocina</h1>
      <p data-gate-text></p>
      <input data-gate-input autocomplete="off" required>
      <div class="gate__quick" data-gate-quick></div>
      <button class="btn btn--primary btn--block" type="submit">Continuar</button>
    </form>
  </div>

  <header class="top">
    <div class="top__brand">
      <img src="../assets/img/logo-128.png" alt="" width="34" height="34">
      <div>
        <strong>DOKO Cocina</strong>
        <span class="conn" data-conexion><i></i><span>Conectando…</span></span>
      </div>
    </div>
    <div class="top__actions">
      <button class="chip" type="button" data-cambiar-nombre title="Cambiar mi nombre"><span data-mi-nombre>—</span></button>
      <button class="icon-btn" type="button" data-sonido title="Sonido para pedidos nuevos" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9H3v6h3l5 4V5L6 9Z"/><path class="on" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/><path class="off" d="m16 9 5 6m0-6-5 6"/></svg>
      </button>
      <button class="btn btn--primary" type="button" data-nuevo>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Nuevo pedido</span>
      </button>
    </div>
  </header>

  <div class="jornada">
    <div class="jornada__reloj">
      <span data-fecha-larga>—</span>
      <strong data-hora>—</strong>
    </div>
    <span class="jornada__info" data-jornada-info>Abriendo jornada…</span>
    <button class="btn btn--sm btn--cierre" type="button" data-abrir-cierre>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9M7.5 6.5a7 7 0 1 0 9 0"/></svg>Cerrar jornada
    </button>
  </div>

  <div class="demo" data-demo hidden>
    <strong>Modo de prueba.</strong> Estos pedidos solo se guardan en este navegador y no llegan a la cocina.
  </div>

  <nav class="tabs" aria-label="Estados de los pedidos">
    <button type="button" data-tab="nuevo" aria-selected="true">Nuevos <b data-count="nuevo">0</b></button>
    <button type="button" data-tab="preparando">Preparando <b data-count="preparando">0</b></button>
    <button type="button" data-tab="listo">Listos <b data-count="listo">0</b></button>
    <button type="button" data-tab="historial">Entregados <b data-count="historial">0</b></button>
  </nav>

  <main class="board">
    <section class="col" data-col="nuevo"><h2>Nuevos</h2><div class="col__list" data-list="nuevo"></div></section>
    <section class="col" data-col="preparando"><h2>Preparando</h2><div class="col__list" data-list="preparando"></div></section>
    <section class="col" data-col="listo"><h2>Listos</h2><div class="col__list" data-list="listo"></div></section>
    <section class="col col--hist" data-col="historial"><h2>Entregados y cancelados hoy</h2><div class="col__list" data-list="historial"></div></section>
  </main>

  <!-- Crear / editar pedido -->
  <dialog class="editor" data-editor aria-labelledby="editor-title">
    <div class="editor__box">
      <header class="editor__head">
        <h2 id="editor-title" data-editor-title>Nuevo pedido</h2>
        <div class="seg seg--panes" data-panes>
          <button type="button" data-pane="catalogo" aria-selected="true">Productos</button>
          <button type="button" data-pane="pedido" aria-selected="false">Pedido <b data-items-count>0</b></button>
        </div>
        <button class="icon-btn" type="button" data-cerrar-editor aria-label="Cerrar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <div class="editor__body" data-editor-body>
        <section class="pane pane--catalogo" data-pane-el="catalogo">
          <div class="catalogo" data-catalogo>
            <input class="search" type="search" placeholder="Buscar producto…" data-buscar aria-label="Buscar producto">
            <div class="cats" data-cats></div>
            <div class="prods" data-prods></div>
          </div>
          <div class="config" data-config hidden></div>
        </section>
        <section class="pane pane--pedido" data-pane-el="pedido">
          <div class="items" data-items></div>
          <form class="datos" data-datos autocomplete="off">
            <div class="row2">
              <label>Cliente<input name="cliente" maxlength="60" placeholder="Nombre"></label>
              <label>Teléfono<input name="telefono" maxlength="30" inputmode="tel" placeholder="Opcional"></label>
            </div>
            <div class="seg" data-tipo>
              <button type="button" data-valor="domicilio" aria-selected="true">🛵 Domicilio</button>
              <button type="button" data-valor="recoger" aria-selected="false">🛍️ Recoger</button>
            </div>
            <div class="row2" data-domicilio>
              <label>Dirección<input name="direccion" maxlength="120" placeholder="Calle, número, apto"></label>
              <label>Barrio<input name="barrio" maxlength="60"></label>
            </div>
            <div class="pagos" data-pagos></div>
            <label>Notas para la cocina<textarea name="notas" rows="2" maxlength="300" placeholder="Ej: salsas aparte, cliente alérgico a…"></textarea></label>
          </form>
        </section>
      </div>
      <footer class="editor__foot">
        <button class="btn btn--ghost btn--danger" type="button" data-eliminar hidden>Eliminar</button>
        <div class="total">Total <strong data-total>$0</strong></div>
        <button class="btn btn--primary" type="button" data-guardar>Enviar a cocina</button>
      </footer>
    </div>
  </dialog>

  <!-- Cierre de jornada -->
  <dialog class="cierre" data-cierre aria-labelledby="cierre-title">
    <div class="cierre__box">
      <header class="editor__head">
        <h2 id="cierre-title">Cerrar jornada</h2>
        <button class="icon-btn" type="button" data-cerrar-cierre aria-label="Cerrar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <div class="cierre__body" data-cierre-body></div>
      <footer class="cierre__foot">
        <button class="btn btn--ghost" type="button" data-solo-excel>Solo descargar Excel</button>
        <button class="btn btn--primary" type="button" data-confirmar-cierre>Cerrar jornada y descargar Excel</button>
      </footer>
      <div class="cierre__anteriores">
        <h3>Reportes de días anteriores</h3>
        <div class="cierre__fila">
          <input type="date" data-cierre-fecha aria-label="Fecha del reporte">
          <button class="btn btn--sm" type="button" data-descargar-anterior>Descargar Excel</button>
        </div>
      </div>
    </div>
  </dialog>

  <div class="toasts" data-toasts aria-live="polite"></div>
  <script type="module" src="cocina.js"></script>
</body>
</html>
